<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="A cel-shaded coastal delivery game built with Three.js."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Tiny Messenger</title>
  </head>
  <body>
    <div id="app" class="not-started">
      <canvas id="scene" aria-label="Tiny Messenger game scene"></canvas>

      <section class="hud" aria-label="Game status">
        <div class="brand">
          <span>Tiny Messenger</span>
        </div>
        <div class="stats">
          <div>
            <span class="label">Letters</span>
            <strong id="letters">0/6</strong>
          </div>
          <div>
            <span class="label">Time</span>
            <strong id="time">180</strong>
          </div>
          <div>
            <span class="label">Streak</span>
            <strong id="streak">0</strong>
          </div>
        </div>
      </section>

      <section class="target" aria-label="Current delivery">
        <span class="label">Next Stop</span>
        <strong id="target">Blue Roof</strong>
      </section>

      <section class="message title-screen" id="message" aria-live="polite">
        <svg viewBox="0 0 96 64" role="img" aria-label="Envelope">
          <path d="M10 14h76v44H10z" />
          <path d="M11 16l37 26 37-26" />
          <path d="M11 58l27-24" />
          <path d="M85 58L58 34" />
        </svg>
        <h1>Tiny Messenger</h1>
        <p>Letters are waiting across the coast.</p>
        <button id="start" type="button">Begin</button>
      </section>

      <div class="controls" aria-label="Movement controls">
        <div
          class="analog"
          id="analog"
          role="application"
          aria-label="Movement analog"
          tabindex="0"
        >
          <div class="analog-ring"></div>
          <div class="analog-guide horizontal"></div>
          <div class="analog-guide vertical"></div>
          <div class="analog-stick" id="analog-stick"></div>
        </div>
        <button class="brake-control" id="brake" type="button" aria-label="Brake">
          Brake
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.js?v=anime-coast-v21"></script>
  </body>
</html>
