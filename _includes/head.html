<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <meta name="author" content="{{ site.author.name | default: site.title }}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 200 | escape }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:image" content="{{ page.cover_image | default: '/assets/img/logo.png' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
  <meta name="twitter:description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 200 | escape }}">
  <meta name="twitter:image" content="{{ page.cover_image | default: '/assets/img/logo.png' | absolute_url }}">
  <meta name="theme-color" content="{{ page.theme_color | default: '#111111' }}">
  <link rel="icon" type="image/png" href="{{ '/assets/img/favicon.ico' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/fa6-pro/css/all.css' | relative_url }}">
  {% assign nav_asset_version = site.nav_asset_version | default: '20260728c' %}
  <link rel="stylesheet" href="{{ '/assets/nav.css' | relative_url }}?v={{ nav_asset_version }}">
  <script src="{{ '/assets/nav.js' | relative_url }}?v={{ nav_asset_version }}" defer></script>
  {% for stylesheet in page.stylesheets %}
    <link rel="stylesheet" href="{{ stylesheet | relative_url }}">
  {% endfor %}
</head>
