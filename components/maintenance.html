<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance</title>
    <link rel="icon" href="/assets/img/favicon.ico">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #080a0f;
            color: #f6f7fb;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background-color: #11151d;
            border: 1px solid #303543;
            border-radius: 8px;
            box-shadow: 0px 18px 50px 0px rgba(0,0,0,0.35);
            padding: 30px;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #f6f7fb;
        }
        p {
            color: #c3cad7;
            margin-top: 20px;
        }
        .contact-link {
            color: #75c7a0;
            text-decoration: none;
        }
        .contact-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Under Maintenance</h1>
        <p id="datetime"></p>
        <p>Sorry, the website is currently undergoing maintenance.</p>
        <p>I'll be back soon!</p>
        <p>In case of urgent matters, please contact me at <a href="https://instagram.com/giofahrezax" class="contact-link">instagram</a>.</p>
    </div>

    <script>
        function updateDateAndTime() {
            const datetimeElement = document.getElementById('datetime');
            if (!datetimeElement) {
                return;
            }

            const datetime = new Date();
            const dateOptions = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                timeZone: 'Asia/Jakarta'
            };
            const timeOptions = {
                hour: 'numeric',
                minute: 'numeric',
                second: 'numeric',
                timeZone: 'Asia/Jakarta',
                timeZoneName: 'short'
            };
            const formattedDate = datetime.toLocaleDateString('en-US', dateOptions);
            const formattedTime = datetime.toLocaleTimeString('en-US', timeOptions);

            datetimeElement.textContent = `${formattedDate} | ${formattedTime}`;
        }

        updateDateAndTime();
        setInterval(updateDateAndTime, 1000);
    </script>
</body>
</html>
