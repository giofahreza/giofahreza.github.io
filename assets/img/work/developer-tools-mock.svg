        <text x="24" y="122" fill="#f2f4f6" font-family="monospace" font-size="28">19:42</text>
        <path d="M24 148h334" stroke="#313c46"/>
        <text x="24" y="180" fill="#7c8994" font-family="monospace" font-size="12">SAN FRANCISCO</text>
        <text x="24" y="220" fill="#75c7a0" font-family="monospace" font-size="28">05:42</text>
      </g>
