        <rect x="24" y="24" width="52" height="52" rx="14" fill="#273541"/>
        <path d="M39 44h22M39 51h22M39 58h22" stroke="#78b8df" stroke-width="3" stroke-linecap="round"/>
        <text x="24" y="112" fill="#edf2ef" font-size="21" font-weight="700">Hash Generator</text>
        <text x="24" y="140" fill="#7d8994" font-size="14">SHA, MD5 and HMAC in your browser.</text>
