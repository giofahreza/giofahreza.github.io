    <rect x="60" y="118" width="262" height="696" fill="#0a0e12"/>
    <text x="94" y="168" fill="#f1f4f6" font-family="Arial, sans-serif" font-size="25" font-weight="700">DEV / TOOLS</text>
    <text x="94" y="195" fill="#77828d" font-family="monospace" font-size="12" letter-spacing="2">BROWSER-ONLY</text>
    <rect x="86" y="232" width="210" height="44" rx="10" fill="#18251f" stroke="#75c7a0" stroke-opacity=".34"/>
