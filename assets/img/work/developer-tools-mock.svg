<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">Developer Tools dashboard mockup</title>
  <desc id="desc">A dark browser interface showing a searchable collection of browser-only developer utilities.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12171d"/>
      <stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182028"/>
      <stop offset="1" stop-color="#10151b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000" flood-opacity=".48"/>
    </filter>
  </defs>
  <rect width="1600" height="860" fill="url(#bg)"/>
  <circle cx="1320" cy="80" r="330" fill="#75c7a0" opacity=".05"/>
  <circle cx="180" cy="800" r="300" fill="#75c7a0" opacity=".035"/>

  <g filter="url(#shadow)">
    <rect x="60" y="46" width="1480" height="768" rx="28" fill="#0d1116" stroke="#353d46" stroke-width="2"/>
    <path d="M60 117h1480" stroke="#303840" stroke-width="2"/>
    <circle cx="100" cy="82" r="8" fill="#f16d6d"/>
    <circle cx="128" cy="82" r="8" fill="#e6b95b"/>
    <circle cx="156" cy="82" r="8" fill="#75c7a0"/>
    <rect x="220" y="66" width="650" height="32" rx="16" fill="#171d24" stroke="#303840"/>
