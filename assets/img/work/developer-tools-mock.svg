          <path d="M99 91h9v18h-9zm0 29h18v9H99zm18 20h9v18h-9zm18 0h18v9h-18zm-36 29h18v9H99zm27 18h27v18h-9v-9h-18z"/>
        </g>
        <rect x="198" y="82" width="112" height="11" rx="5" fill="#596570"/>
        <rect x="198" y="111" width="86" height="9" rx="4" fill="#37414a"/>
        <rect x="198" y="170" width="118" height="38" rx="9" fill="#203d32"/>
        <text x="219" y="195" fill="#75c7a0" font-family="monospace" font-size="12">GENERATE</text>
