    <rect x="1057" y="117" width="481" height="697" fill="#080d12"/>
    <path d="M1057 170h481" stroke="#27333d"/>
    <text x="1087" y="151" fill="#d6e0e4" font-family="monospace" font-size="13">handler/order.go</text>
    <g font-family="monospace" font-size="14">
      <g fill="#4f5d68">
        <text x="1083" y="214">01</text><text x="1083" y="246">02</text><text x="1083" y="278">03</text>
        <text x="1083" y="310">04</text><text x="1083" y="342">05</text><text x="1083" y="374">06</text>
        <text x="1083" y="406">07</text><text x="1083" y="438">08</text><text x="1083" y="470">09</text>
        <text x="1083" y="502">10</text><text x="1083" y="534">11</text><text x="1083" y="566">12</text>
      </g>
      <text x="1122" y="214" fill="#c79bd8">func</text>
      <text x="1162" y="214" fill="#dce5e8">CreateOrder(w http.ResponseWriter, r *http.Request) {</text>
      <text x="1143" y="246" fill="#c79bd8">var</text><text x="1175" y="246" fill="#dce5e8">input CreateOrderInput</text>
      <text x="1143" y="278" fill="#c79bd8">if</text><text x="1167" y="278" fill="#dce5e8">err := decode(r, &amp;input); err != nil {</text>
      <text x="1164" y="310" fill="#73c7dc">respondError</text><text x="1268" y="310" fill="#dce5e8">(w, err)</text>
      <text x="1164" y="342" fill="#c79bd8">return</text>
      <text x="1143" y="374" fill="#dce5e8">}</text>
      <text x="1143" y="406" fill="#dce5e8">order, err := h.service.Create(r.Context(), input)</text>
      <text x="1143" y="438" fill="#c79bd8">if</text><text x="1167" y="438" fill="#dce5e8">err != nil {</text>
      <text x="1164" y="470" fill="#73c7dc">respondError</text><text x="1268" y="470" fill="#dce5e8">(w, err)</text>
      <text x="1164" y="502" fill="#c79bd8">return</text>
      <text x="1143" y="534" fill="#dce5e8">}</text>
      <text x="1143" y="566" fill="#73c7dc">respondJSON</text><text x="1245" y="566" fill="#dce5e8">(w, http.StatusCreated, order)</text>
      <text x="1122" y="598" fill="#dce5e8">}</text>
    </g>
